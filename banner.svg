<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 740" width="1280" height="740">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0314" />
      <stop offset="40%" stop-color="#18072b" />
      <stop offset="80%" stop-color="#2d0b4e" />
      <stop offset="100%" stop-color="#120422" />
    </linearGradient>

    <!-- Text & Glow Gradient (Pink to Purple) -->
    <linearGradient id="pinkPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a8d" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#9d4edf" />
    </linearGradient>

    <!-- Accent Neon Cyan -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Glassmorphism Card Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Scanline Glow Gradient -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a8d" stop-opacity="0" />
      <stop offset="20%" stop-color="#ff2a8d" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="1" />
      <stop offset="80%" stop-color="#ff2a8d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff2a8d" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Clip Paths -->
    <clipPath id="bannerClip">
      <rect width="1280" height="740" rx="24" ry="24" />
    </clipPath>

    <clipPath id="charClip">
      <rect width="440" height="610" rx="16" />
    </clipPath>
  </defs>

  <style>
    @keyframes scanSweep {
      0% { transform: translateY(-10px); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translateY(750px); opacity: 0; }
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes roleCycle {
      0%, 20% { opacity: 0; transform: translateY(8px); }
      25%, 45% { opacity: 1; transform: translateY(0); }
      50%, 70% { opacity: 0; transform: translateY(-8px); }
      75%, 95% { opacity: 1; transform: translateY(0); }
    }
    @keyframes neonFlicker {
      0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #ff2a8d) drop-shadow(0 0 14px #ff2a8d); }
      19%, 21%, 24%, 54%, 56% { opacity: 0.35; filter: none; }
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-70px) scale(1.2); opacity: 0; }
    }
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      50% { transform: scale(1.25); opacity: 0.65; }
    }

    .bg-orb-1 { animation: pulseOrb 6s ease-in-out infinite; transform-origin: 200px 200px; }
    .bg-orb-2 { animation: pulseOrb 8s ease-in-out infinite 1s; transform-origin: 1000px 500px; }
    .p-float-1 { animation: floatUp 4s ease-in-out infinite; }
    .p-float-2 { animation: floatUp 5s ease-in-out infinite 1.5s; }
    .pill { transition: all 0.3s ease; }
    .pill:hover { fill: #ff2a8d; cursor: pointer; }
    .neon-text { animation: neonFlicker 4s infinite; }
    .scanner-line { animation: scanSweep 3.5s linear infinite; }
  </style>

  <g clip-path="url(#bannerClip)">
    <!-- Background Base -->
    <rect width="1280" height="740" fill="url(#bgGrad)" />

    <!-- Ambient Glowing Orbs -->
    <circle class="bg-orb-1" cx="200" cy="180" r="220" fill="#9d4edf" opacity="0.25" filter="blur(60px)" />
    <circle class="bg-orb-2" cx="1000" cy="520" r="260" fill="#ff2a8d" opacity="0.2" filter="blur(70px)" />

    <!-- Floating Particles & Hearts -->
    <g fill="#ff75c3">
      <circle class="p-float-1" cx="150" cy="600" r="4" />
      <circle class="p-float-2" cx="320" cy="650" r="3" />
      <path class="p-float-1" d="M 220 500 C 220 495 215 490 210 490 C 204 490 200 495 200 500 C 200 510 210 518 210 518 C 210 518 220 510 220 500 Z" fill="#ff2a8d" opacity="0.6" />
      <path class="p-float-2" d="M 600 200 C 600 195 595 190 590 190 C 584 190 580 195 580 200 C 580 210 590 218 590 218 C 590 218 600 210 600 200 Z" fill="#d946ef" opacity="0.5" />
    </g>

    <!-- Terminal Window -->
    <g transform="translate(50, 45)">
      <rect width="660" height="48" rx="10" fill="#0f051d" stroke="#3b1560" stroke-width="1.5" />
      <circle cx="20" cy="24" r="6" fill="#ff5f56" />
      <circle cx="38" cy="24" r="6" fill="#ffbd2e" />
      <circle cx="56" cy="24" r="6" fill="#27c93f" />
      <foreignObject x="80" y="8" width="560" height="36">
        <div xmlns="http://www.w3.org/1999/xhtml" style="color: #00f2fe; font-family: 'Fira Code', monospace; font-size: 16px; font-weight: 600; line-height: 32px;">
          <span style="color: #ff2a8d;">user@dev:~$</span> cat README.md<span style="animation: blink 0.8s infinite; color: #ff2a8d;">_</span>
        </div>
      </foreignObject>
    </g>

    <!-- NAME SECTION -->
    <g transform="translate(50, 120)">
      <g filter="url(#pinkGlow)">
        <text x="0" y="55" font-family="'Poppins', sans-serif" font-size="52" font-weight="900" letter-spacing="2" fill="url(#pinkPurple)">
          VENKTESH BHUSHAN
        </text>
      </g>
    </g>

    <!-- CYCLING ROLES -->
    <g transform="translate(50, 205)">
      <rect width="320" height="34" rx="8" fill="#1f0a38" stroke="#ff2a8d" stroke-opacity="0.4" stroke-width="1" />
      <foreignObject x="12" y="2" width="300" height="30">
        <div xmlns="http://www.w3.org/1999/xhtml" style="color: #00f2fe; font-family: 'Fira Code', monospace; font-size: 15px; font-weight: 700; line-height: 28px;">
          <span style="color: #ff75c3;">&gt; </span><span style="animation: roleCycle 8s infinite; display: inline-block;">Computer Science Student</span>
        </div>
      </foreignObject>
    </g>

    <!-- TAGLINE BOX -->
    <g transform="translate(50, 255)">
      <rect width="660" height="46" rx="10" fill="url(#glassGrad)" stroke="#9d4edf" stroke-opacity="0.3" stroke-width="1" />
      <foreignObject x="16" y="8" width="630" height="30">
        <div xmlns="http://www.w3.org/1999/xhtml" style="color: #f1f5f9; font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 600; line-height: 28px;">
          💬 <span style="color: #ff2a8d;">"</span>Dream • Build • Debug • Repeat<span style="color: #ff2a8d;">"</span>
        </div>
      </foreignObject>
    </g>

    <!-- TECH STACK PILLS -->
    <g transform="translate(50, 318)">
      <g class="pill" transform="translate(0, 0)">
        <rect width="100" height="32" rx="16" fill="#240c42" stroke="#ff2a8d" stroke-width="1.5" />
        <text x="50" y="21" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">⚡ C++</text>
      </g>
      <g class="pill" transform="translate(112, 0)">
        <rect width="130" height="32" rx="16" fill="#240c42" stroke="#d946ef" stroke-width="1.5" />
        <text x="65" y="21" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">🎨 HTML &amp; CSS</text>
      </g>
      <g class="pill" transform="translate(254, 0)">
        <rect width="130" height="32" rx="16" fill="#240c42" stroke="#00f2fe" stroke-width="1.5" />
        <text x="65" y="21" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">🌐 JavaScript</text>
      </g>
      <g class="pill" transform="translate(396, 0)">
        <rect width="160" height="32" rx="16" fill="#240c42" stroke="#ff75c3" stroke-width="1.5" />
        <text x="80" y="21" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">🧠 Problem Solving</text>
      </g>
    </g>

    <!-- CODE EDITOR CARD -->
    <g transform="translate(50, 368)">
      <rect width="660" height="210" rx="14" fill="#0d041a" stroke="#4a154b" stroke-width="1.5" />
      <path d="M 0 14 A 14 14 0 0 1 14 0 L 646 0 A 14 14 0 0 1 660 14 L 660 34 L 0 34 Z" fill="#17062c" />
      <text x="20" y="22" fill="#9d4edf" font-family="monospace" font-size="13" font-weight="700">buildDreams.jsx</text>
      <foreignObject x="20" y="45" width="620" height="150">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Fira Code', monospace; font-size: 14px; line-height: 24px; color: #e2e8f0;">
          <div><span style="color: #ff2a8d; font-weight: bold;">const</span> <span style="color: #00f2fe;">buildDreams</span> = () <span style="color: #ff2a8d;">=&gt;</span> {</div>
          <div style="padding-left: 20px;"><span style="color: #d946ef; font-weight: bold;">while</span> (alive) {</div>
          <div style="padding-left: 40px;"><span style="color: #00f2fe;">eat</span>();</div>
          <div style="padding-left: 40px;"><span style="color: #ff75c3; font-weight: bold;">code</span>();</div>
          <div style="padding-left: 40px;"><span style="color: #00f2fe;">sleep</span>();</div>
          <div style="padding-left: 20px;">}</div>
          <div>};</div>
        </div>
      </foreignObject>
    </g>

    <!-- NEON SIGN -->
    <g transform="translate(50, 600)">
      <rect width="660" height="54" rx="12" fill="#140526" stroke="#ff2a8d" stroke-width="2" />
      <text class="neon-text" x="330" y="35" text-anchor="middle" font-family="'Impact', sans-serif" font-size="22" font-weight="900" letter-spacing="4" fill="#ff2a8d" filter="url(#neonGlow)">
        ⚡ KEEP CODING • KEEP GROWING ⚡
      </text>
    </g>

    <!-- RIGHT SIDE: CHARACTER FRAME WITH YOUR UPLOADED IMAGE -->
    <g transform="translate(750, 45)">
      <rect width="480" height="650" rx="20" fill="url(#glassGrad)" stroke="#ff2a8d" stroke-opacity="0.5" stroke-width="2" />
      <g clip-path="url(#charClip)" transform="translate(20, 20)">
        <rect width="440" height="610" fill="#18072b" />
        <!-- Directly displays animated_image.png from your repository -->
        <image href="https://raw.githubusercontent.com/VENKAT-Coder79/VENKAT-Coder79/main/animated_image.png" x="0" y="0" width="440" height="610" preserveAspectRatio="xMidYMid meet" />
      </g>
    </g>

    <!-- CONTINUOUS FULL-WIDTH SCANNER -->
    <g class="scanner-line">
      <rect x="0" y="0" width="1280" height="4" fill="url(#scanGrad)" filter="url(#neonGlow)" />
    </g>
  </g>
</svg>
