<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 740" width="1280" height="740">
  <defs>
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fcf4ff" />
      <stop offset="100%" stop-color="#f3e8ff" />
    </linearGradient>
    <linearGradient id="pinkPurpleLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d81b60" />
      <stop offset="50%" stop-color="#8e24aa" />
      <stop offset="100%" stop-color="#4a148c" />
    </linearGradient>
    <clipPath id="bannerClipLight">
      <rect width="1280" height="740" rx="24" ry="24" />
    </clipPath>
    <clipPath id="charClipLight">
      <rect width="440" height="610" rx="16" />
    </clipPath>
  </defs>

  <style>
    @keyframes scanSweep {
      0% { transform: translateY(-10px); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translateY(750px); opacity: 0; }
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes roleCycle {
      0%, 20% { opacity: 0; transform: translateY(8px); }
      25%, 45% { opacity: 1; transform: translateY(0); }
      50%, 70% { opacity: 0; transform: translateY(-8px); }
      75%, 95% { opacity: 1; transform: translateY(0); }
    }
    .scanner-line { animation: scanSweep 3.5s linear infinite; }
  </style>

  <g clip-path="url(#bannerClipLight)">
    <rect width="1280" height="740" fill="url(#bgGradLight)" />

    <!-- Terminal Window -->
    <g transform="translate(50, 45)">
      <rect width="660" height="48" rx="10" fill="#1e1b4b" />
      <circle cx="20" cy="24" r="6" fill="#ff5f56" />
      <circle cx="38" cy="24" r="6" fill="#ffbd2e" />
      <circle cx="56" cy="24" r="6" fill="#27c93f" />
      <foreignObject x="80" y="8" width="560" height="36">
        <div xmlns="http://www.w3.org/1999/xhtml" style="color: #38bdf8; font-family: 'Fira Code', monospace; font-size: 16px; font-weight: 600; line-height: 32px;">
          <span style="color: #f472b6;">user@dev:~$</span> cat README.md<span style="animation: blink 0.8s infinite; color: #f472b6;">_</span>
        </div>
      </foreignObject>
    </g>

    <!-- NAME -->
    <g transform="translate(50, 120)">
      <text x="0" y="55" font-family="'Poppins', sans-serif" font-size="52" font-weight="900" letter-spacing="2" fill="url(#pinkPurpleLight)">
        VENKTESH BHUSHAN
      </text>
    </g>

    <!-- CYCLING ROLES -->
    <g transform="translate(50, 205)">
      <rect width="320" height="34" rx="8" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.5" />
      <foreignObject x="12" y="2" width="300" height="30">
        <div xmlns="http://www.w3.org/1999/xhtml" style="color: #6b21a8; font-family: 'Fira Code', monospace; font-size: 15px; font-weight: 700; line-height: 28px;">
          <span style="color: #d81b60;">&gt; </span><span style="animation: roleCycle 8s infinite; display: inline-block;">Computer Science Student</span>
        </div>
      </foreignObject>
    </g>

    <!-- TAGLINE -->
    <g transform="translate(50, 255)">
      <rect width="660" height="46" rx="10" fill="#ffffff" stroke="#e9d5ff" stroke-width="1" />
      <foreignObject x="16" y="8" width="630" height="30">
        <div xmlns="http://www.w3.org/1999/xhtml" style="color: #334155; font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 600; line-height: 28px;">
          💬 <span style="color: #d81b60;">"</span>Dream • Build • Debug • Repeat<span style="color: #d81b60;">"</span>
        </div>
      </foreignObject>
    </g>

    <!-- TECH STACK PILLS -->
    <g transform="translate(50, 318)">
      <g transform="translate(0, 0)"><rect width="100" height="32" rx="16" fill="#ffffff" stroke="#d81b60" stroke-width="1.5" /><text x="50" y="21" text-anchor="middle" fill="#881337" font-family="sans-serif" font-size="13" font-weight="700">⚡ C++</text></g>
      <g transform="translate(112, 0)"><rect width="130" height="32" rx="16" fill="#ffffff" stroke="#8e24aa" stroke-width="1.5" /><text x="65" y="21" text-anchor="middle" fill="#581c87" font-family="sans-serif" font-size="13" font-weight="700">🎨 HTML &amp; CSS</text></g>
      <g transform="translate(254, 0)"><rect width="130" height="32" rx="16" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" /><text x="65" y="21" text-anchor="middle" fill="#0369a1" font-family="sans-serif" font-size="13" font-weight="700">🌐 JavaScript</text></g>
      <g transform="translate(396, 0)"><rect width="160" height="32" rx="16" fill="#ffffff" stroke="#d81b60" stroke-width="1.5" /><text x="80" y="21" text-anchor="middle" fill="#9f1239" font-family="sans-serif" font-size="13" font-weight="700">🧠 Problem Solving</text></g>
    </g>

    <!-- CODE EDITOR CARD -->
    <g transform="translate(50, 368)">
      <rect width="660" height="210" rx="14" fill="#0f172a" />
      <path d="M 0 14 A 14 14 0 0 1 14 0 L 646 0 A 14 14 0 0 1 660 14 L 660 34 L 0 34 Z" fill="#1e293b" />
      <text x="20" y="22" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">buildDreams.jsx</text>
      <foreignObject x="20" y="45" width="620" height="150">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Fira Code', monospace; font-size: 14px; line-height: 24px; color: #f8fafc;">
          <div><span style="color: #f472b6; font-weight: bold;">const</span> <span style="color: #38bdf8;">buildDreams</span> = () <span style="color: #f472b6;">=&gt;</span> {</div>
          <div style="padding-left: 20px;"><span style="color: #c084fc; font-weight: bold;">while</span> (alive) {</div>
          <div style="padding-left: 40px;"><span style="color: #38bdf8;">eat</span>();</div>
          <div style="padding-left: 40px;"><span style="color: #f472b6; font-weight: bold;">code</span>();</div>
          <div style="padding-left: 40px;"><span style="color: #38bdf8;">sleep</span>();</div>
          <div style="padding-left: 20px;">}</div>
          <div>};</div>
        </div>
      </foreignObject>
    </g>

    <!-- NEON SIGN -->
    <g transform="translate(50, 600)">
      <rect width="660" height="54" rx="12" fill="#ffffff" stroke="#d81b60" stroke-width="2" />
      <text x="330" y="35" text-anchor="middle" font-family="'Impact', sans-serif" font-size="22" font-weight="900" letter-spacing="4" fill="#d81b60">
        ⚡ KEEP CODING • KEEP GROWING ⚡
      </text>
    </g>

    <!-- RIGHT SIDE CHARACTER IMAGE -->
    <g transform="translate(750, 45)">
      <rect width="480" height="650" rx="20" fill="#ffffff" stroke="#c084fc" stroke-width="2" />
      <g clip-path="url(#charClipLight)" transform="translate(20, 20)">
        <rect width="440" height="610" fill="#faf5ff" />
        <image href="https://raw.githubusercontent.com/VENKAT-Coder79/VENKAT-Coder79/main/animated_image.png" x="0" y="0" width="440" height="610" preserveAspectRatio="xMidYMid meet" />
      </g>
    </g>

    <!-- SCANNER LINE -->
    <g class="scanner-line">
      <rect x="0" y="0" width="1280" height="4" fill="#0284c7" />
    </g>
  </g>
</svg>
