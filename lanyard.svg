<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="400" height="550">
  <defs>
    <!-- Strap Gradient -->
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a8d" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#9d4edf" />
    </linearGradient>

    <!-- Glass Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0734" />
      <stop offset="100%" stop-color="#0a0214" />
    </linearGradient>

    <!-- Shine Sweep Gradient -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Metallic Clip Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Avatar Glow -->
    <filter id="avatarGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Physics: Damped Pendulum Drop-In + Gentle Continuous Sway */
    @keyframes pendulumPhysics {
      0% { transform: rotate(-28deg) translateY(-180px); opacity: 0; }
      20% { transform: rotate(20deg) translateY(0); opacity: 1; }
      40% { transform: rotate(-12deg); }
      60% { transform: rotate(6deg); }
      80% { transform: rotate(-3deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes gentleSway {
      0%, 100% { transform: rotate(-2.5deg); }
      50% { transform: rotate(2.5deg); }
    }

    /* Continuous Holographic Shine Sweep */
    @keyframes shineSweep {
      0% { transform: translateX(-300px) translateY(-300px) rotate(25deg); }
      100% { transform: translateX(400px) translateY(400px) rotate(25deg); }
    }

    .lanyard-wrapper {
      transform-origin: 200px 0px;
      animation: pendulumPhysics 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards, gentleSway 4s ease-in-out 1.8s infinite;
    }

    .shine-layer {
      animation: shineSweep 3.5s ease-in-out infinite;
    }
  </style>

  <g class="lanyard-wrapper">
    <!-- LANYARD STRAP -->
    <path d="M 165 0 L 182 140 L 218 140 L 235 0 Z" fill="url(#strapGrad)" />
    <!-- Printed Text on Strap -->
    <text x="190" y="70" font-family="'Fira Code', monospace" font-size="9" font-weight="800" fill="#ffffff" opacity="0.85" transform="rotate(84 190 70)">
      VENKTESH BHUSHAN • STUDENT
    </text>
    <text x="210" y="70" font-family="'Fira Code', monospace" font-size="9" font-weight="800" fill="#ffffff" opacity="0.85" transform="rotate(96 210 70)">
      VENKTESH BHUSHAN • STUDENT
    </text>

    <!-- METAL CLASP & RING -->
    <g transform="translate(180, 135)">
      <!-- Ring -->
      <path d="M 10 0 C 4 0 0 4 0 10 C 0 16 4 20 10 20 C 16 20 20 16 20 10 C 20 4 16 0 10 0 Z" fill="none" stroke="url(#metalGrad)" stroke-width="4" />
      <!-- Metal Holder Clip -->
      <rect x="2" y="16" width="36" height="18" rx="4" fill="url(#metalGrad)" />
      <rect x="15" y="24" width="10" height="20" rx="2" fill="url(#metalGrad)" />
    </g>

    <!-- ID BADGE CARD CONTAINER -->
    <g transform="translate(60, 175)">
      <!-- Card Outer Shadow / Glow -->
      <rect width="280" height="350" rx="18" fill="none" stroke="#ff2a8d" stroke-opacity="0.6" stroke-width="2" filter="url(#avatarGlow)" />
      
      <!-- Main Badge Base -->
      <rect width="280" height="350" rx="18" fill="url(#badgeGrad)" stroke="#9d4edf" stroke-width="1.5" />

      <!-- Top Lanyard Hole Slot -->
      <rect x="110" y="12" width="60" height="10" rx="5" fill="#0b0314" stroke="#475569" stroke-width="1.5" />

      <!-- AVATAR RING & CROPPED FACE -->
      <g transform="translate(140, 105)">
        <circle cx="0" cy="0" r="48" fill="none" stroke="url(#strapGrad)" stroke-width="3" filter="url(#avatarGlow)" />
        <clipPath id="avatarClip">
          <circle cx="0" cy="0" r="44" />
        </clipPath>
        <g clip-path="url(#avatarClip)">
          <rect x="-44" y="-44" width="88" height="88" fill="#fbcfe8" />
          <!-- Cropped Face Art -->
          <ellipse cx="0" cy="-5" rx="26" ry="32" fill="#fbcfe8" />
          <!-- Hair -->
          <path d="M -32 -10 C -30 -45 30 -45 32 -10 C 20 -30 -20 -30 -32 -10 Z" fill="#1e1b4b" />
          <!-- Glasses -->
          <rect x="-22" y="-12" width="18" height="12" rx="2" fill="none" stroke="#334155" stroke-width="2" />
          <rect x="4" y="-12" width="18" height="12" rx="2" fill="none" stroke="#334155" stroke-width="2" />
          <line x1="-4" y1="-6" x2="4" y2="-6" stroke="#334155" stroke-width="2" />
        </g>
      </g>

      <!-- BADGE DETAILS -->
      <text x="140" y="185" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="18" font-weight="800" fill="#ffffff">
        VENKTESH BHUSHAN
      </text>
      
      <text x="140" y="208" text-anchor="middle" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#ff75c3">
        STUDENT &amp; DEVELOPER
      </text>

      <rect x="50" y="222" width="180" height="22" rx="11" fill="#240c42" stroke="#00f2fe" stroke-width="1" />
      <text x="140" y="237" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#00f2fe">
        @VENKAT-Coder79
      </text>

      <!-- BARCODE GRAPHIC -->
      <g transform="translate(60, 265)" fill="#ffffff" opacity="0.75">
        <rect x="0" y="0" width="3" height="30" />
        <rect x="6" y="0" width="1" height="30" />
        <rect x="10" y="0" width="4" height="30" />
        <rect x="17" y="0" width="2" height="30" />
        <rect x="22" y="0" width="5" height="30" />
        <rect x="30" y="0" width="1" height="30" />
        <rect x="34" y="0" width="3" height="30" />
        <rect x="40" y="0" width="2" height="30" />
        <rect x="45" y="0" width="6" height="30" />
        <rect x="54" y="0" width="2" height="30" />
        <rect x="59" y="0" width="4" height="30" />
        <rect x="66" y="0" width="1" height="30" />
        <rect x="70" y="0" width="3" height="30" />
        <rect x="76" y="0" width="5" height="30" />
        <rect x="84" y="0" width="2" height="30" />
        <rect x="89" y="0" width="4" height="30" />
        <rect x="96" y="0" width="2" height="30" />
        <rect x="101" y="0" width="6" height="30" />
        <rect x="110" y="0" width="2" height="30" />
        <rect x="115" y="0" width="3" height="30" />
        <rect x="121" y="0" width="1" height="30" />
        <rect x="125" y="0" width="4" height="30" />
        <rect x="132" y="0" width="2" height="30" />
        <rect x="137" y="0" width="5" height="30" />
        <rect x="145" y="0" width="2" height="30" />
        <rect x="150" y="0" width="3" height="30" />
        <rect x="156" y="0" width="4" height="30" />
      </g>
      <text x="140" y="310" text-anchor="middle" font-family="monospace" font-size="9" fill="#a78bfa" letter-spacing="3">
        8940-VENKAT-2026
      </text>

      <!-- HOLOGRAPHIC SHINE OVERLAY -->
      <g clip-path="url(#badgeClip)">
        <rect class="shine-layer" x="-100" y="-100" width="350" height="350" fill="url(#shineGrad)" pointer-events="none" />
      </g>
    </g>
  </g>
</svg>
